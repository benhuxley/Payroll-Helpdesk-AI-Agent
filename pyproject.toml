[project]
name = "payroll-helpdesk-agent"
version = "0.1.0"
description = "A customer-support AI agent for an employee payroll/HR helpdesk, with layered guardrails, traces and an eval harness."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ben Huxley" }]
dependencies = [
    "anthropic>=1.15,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
helpdesk-chat = "helpdesk.cli:main"
helpdesk-demo = "helpdesk.web.demo:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helpdesk = ["agent/prompts/*.md", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style is fine here
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
